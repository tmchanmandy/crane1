<!DOCTYPE html>
<html>
<head>
    <title>Crane calculator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
        .container { padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; text-align: center; }
        #error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crane calculator</h1>
        <form id="paramForm">
            <div class = "form-group">
                <label for = "model">Working Model</label>
                <input type = "text" id = "model" required>
            </div>
            <div class="form-group">
                <label for="param1">Working radius: (distance between point of rotation and target object)</label>
                <input type = "number" step = "any" id = "param1" required>
            </div>
            <div class="form-group">
                <label for="param2">building_height:</label>
                <input type = "number" step = "any" id = "param2" required>
            </div>
            <div class="form-group">
                <label for="param3">building_distance:</label>
                <input type = "number" step = "any" id = "param3" required>
            </div>
            <div class="form-group">
                <label for="param4">safety_margin:</label>
                <input type = "number" step = "any" id = "param4" required>
            </div>
            <div class="form-group">
                <label for="param5">J:</label>
                <input type = "number" step = "any" id = "param5" required>
            </div>
            <div class="form-group">
                <label for="param6">A 吊裝尾距地面:</label>
                <input type = "number" step = "any" id = "param6" required>
            </div>
            <div class="form-group">
                <label for="param7">D 吊裝尾部(boom foot pin)距離回轉中心(slewing center):</label>
                <input type = "number" step = "any" id = "param7" required>
            </div>
            <button type="submit">Get Result</button>
        </form>

        <div id="result">
            <!-- Image will appear here -->
        </div>
        <div id="error"></div>
    </div>

    <script>
        const model_names = {{ model_namelist | tojson | safe }};
        function validateModel(input) {
            // Trim whitespace and convert to uppercase
            const cleaned = input.trim().toUpperCase();

            // Check exact match
            if (model_names.includes(cleaned)) {
                return {
                    isValid: true,
                    model: cleaned,
                    validModels: model_names
                };
            }
            return {
                isValid: false,
                model: cleaned,
                validModels: model_names
            };
        }

        document.getElementById('paramForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Get input values
            let model = document.getElementById('model').value;
            const param1 = parseFloat(document.getElementById('param1').value);
            const param2 = parseFloat(document.getElementById('param2').value);
            const param3 = parseFloat(document.getElementById('param3').value);
            const param4 = parseFloat(document.getElementById('param4').value);
            const param5 = parseFloat(document.getElementById('param5').value);
            const param6 = parseFloat(document.getElementById('param6').value);
            const param7 = parseFloat(document.getElementById('param7').value);

            // Clear previous results
            document.getElementById('result').innerHTML = '';
            document.getElementById('error').textContent = '';


            const validation = validateModel(model);
            model = validation.model;
            if (!validation.isValid) {
                document.getElementById('error').innerHTML = `
                <div style="color: red; padding: 10px; background: #ffeeee; border-radius: 5px;">
                    <strong>Invalid Model</strong><br>
                    Valid options are: ${validation.validModels.join(", ")}
                </div>
                `;
                return; // Stop form submission
            }

            try {
                // 👇 REPLACE WITH YOUR ACTUAL API ENDPOINT URL
                const apiUrl = 'https://python-web-api-server-culw.vercel.app/crane-calculator';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: model,
                        working_radius: param1,
                        building_height: param2,
                        building_distance: param3,
                        safety_margin: param4,
                        J: param5,
                        A: param6,
                        D: param7
                    })
                });

                const data = await response.json();

                //data inputted are not feasible for that crane
                if (data.estimated_lifting_capacity === 0 || data.estimated_lifting_capacity === "0") {
                    document.getElementById('error').innerHTML = `
                    <div style="color: red; padding: 10px; background: #ffeeee; border-radius: 5px;">
                        <strong>Invalid Input:</strong> The calculated lifting capacity is 0.<br>
                        Please check your input values and try again.
                    </div>
                `;
                //other error: negative input values, too small/large, etc.
                } else if (data.estimated_lifting_capacity === -1 || data.estimated_lifting_capacity === "-1") {
                    document.getElementById('error').innerHTML = `
                    <div style="color: red; padding: 10px; background: #ffeeee; border-radius: 5px;">
                        <strong>Invalid Input:</strong> ${data.error}.<br>
                        Please check your input values and try again.
                    </div>
                    `;
                } else {
                // Display results if valid
                    document.getElementById('result').innerHTML = `
                        <img src="data:image/png;base64,${data.image}"
                            alt="Crane Plot" style="max-width: 100%;">
                    <div class="parameters">
                        <p>Model Type: ${data.model}</p>
                        <p>Horizontal Arm Angle: ${data.horizontal_arm_angle}°</p>
                        <p>Vertical Arm Angle: ${data.vertical_arm_angle}°</p>
                        <p>Boom Length: ${data.boom_length}m</p>
                        <p>Lifting Capacity: ${data.estimated_lifting_capacity} tons</p>
                    </div>
                    `;
                }
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }


            }catch (e){
                return "error";
            }

        });
    </script>
</body>
</html>
