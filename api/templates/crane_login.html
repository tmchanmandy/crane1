<!DOCTYPE html>
<html>
<head>
    <title>Login to Crane calculator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
        .container { padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; text-align: center; }
        #error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Crane Calculator</h1>
        <form id="paramForm">
            <div class="form-group">
                <label for = "username">Username:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for = "password">Password:</label>
                <input type="text" id="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="error"></div>
    </div>

    <script>
        document.getElementById('paramForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get input values
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Clear previous results
            document.getElementById('error').textContent = '';
            
            try {
                // 👇 REPLACE WITH YOUR ACTUAL API ENDPOINT URL
                const apiUrl = 'https://python-web-api-server-culw.vercel.app/login';
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const valid_account = await response.json();
                
                if (valid_account.valid === 0 || valid_account.valid === "0"){
                    document.getElementById('error').innerHTML = `
                    <div style="color: red; padding: 10px; background: #ffeeee; border-radius: 5px;">
                        <strong>Invalid Account:</strong> Invalid username or password.<br>
                        Please enter again.
                    </div>
                    `;
                }else{
                    window.location.href = valid_account.redirect;
                }
            } catch (error) {
                document.getElementById('error').textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
